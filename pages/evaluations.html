<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluations — Eskom Theft Detection</title>
  <link rel="stylesheet" href="../css/dashboard.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html,body,.layout,.main{height:100%;}
    .main{display:flex;flex-direction:column;overflow:hidden;}
    .page-body{flex:1;overflow-y:auto;padding:24px 32px;}
    .page-grid{display:grid;grid-template-columns:1fr 380px;gap:22px;align-items:start;}
    .card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:20px;}
    .card h3{font-size:15px;font-weight:700;color:#0f1a3e;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid #e5e9f5;}
    .form-row{margin-bottom:16px;}
    .form-row label{display:block;font-size:12px;font-weight:600;color:#6b7280;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
    .form-row select,.form-row textarea,.form-row input{width:100%;padding:10px 12px;border-radius:8px;border:1.5px solid #e5e9f5;font-family:inherit;font-size:13.5px;color:#0f1a3e;background:#f8fafc;box-sizing:border-box;transition:border-color .2s;}
    .form-row select:focus,.form-row textarea:focus,.form-row input:focus{outline:none;border-color:#2563eb;background:#fff;}
    .form-row textarea{resize:vertical;min-height:80px;}
    /* Stars */
    .stars-row{display:flex;gap:6px;margin-top:6px;}
    .star{cursor:pointer;transition:color .15s;display:inline-flex;align-items:center;}
    .star i{font-size:20px;color:#d1d5db;transition:color .12s;}
    .star.filled i, .star:hover i{color:#f59e0b;}
    /* Submit button */
    .btn-submit{width:100%;padding:13px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:background .2s;}
    .btn-submit:hover{background:#1d4ed8;}
    .btn-submit:disabled{opacity:.5;cursor:not-allowed;}
    /* Status msg */
    .status-msg{padding:12px 16px;border-radius:9px;font-size:13px;font-weight:600;margin-top:14px;display:none;}
    .status-msg.success{background:#dcfce7;color:#15803d;border:1px solid #bbf7d0;}
    .status-msg.error{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca;}
    .status-msg.info{background:#dbeafe;color:#1d4ed8;border:1px solid #bfdbfe;}
    /* Eval cards list */
    .eval-card{background:#f8fafc;border:1.5px solid #e5e9f5;border-radius:10px;padding:16px 18px;margin-bottom:12px;}
    .eval-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
    .eval-name{font-size:14px;font-weight:700;color:#0f1a3e;}
    .eval-stars{color:#f59e0b;font-size:15px;letter-spacing:1px;}
    .eval-date{font-size:11px;color:#9ca3af;}
    .eval-feedback{font-size:13px;color:#374151;line-height:1.5;margin-bottom:10px;}
    .rating-bars{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
    .rating-row{display:flex;align-items:center;gap:8px;font-size:12px;}
    .rating-label{width:100px;color:#6b7280;flex-shrink:0;}
    .rating-bar-bg{flex:1;height:6px;background:#e5e9f5;border-radius:3px;}
    .rating-bar-fill{height:100%;background:#2563eb;border-radius:3px;}
    .rating-num{width:24px;text-align:right;font-weight:600;color:#374151;}
    /* Search */
    .search-bar{display:flex;gap:10px;margin-bottom:16px;}
    .search-bar input{flex:1;padding:10px 14px;border-radius:9px;border:1.5px solid #e5e9f5;font-family:inherit;font-size:13px;background:#f8fafc;}
    .search-bar input:focus{outline:none;border-color:#2563eb;}
    /* Breadcrumb */
    .breadcrumb{font-size:12px;color:#9ca3af;margin-bottom:16px;}
    .breadcrumb a{color:#2563eb;text-decoration:none;}
    @media(max-width:900px){.page-grid{grid-template-columns:1fr;}}
  </style>
</head>
<body>
<div class="layout">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon"><i class="fa-solid fa-bolt"></i></div>
      <div><h2>Eskom</h2><p>Theft Detection</p></div>
    </div>
    <nav class="menu" id="sidebarMenu">
      <p class="menu-title">NAVIGATION</p>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <header class="topbar">
      <div>
        <h1>Evaluations</h1>
        <p>Review and submit investigator performance evaluations</p>
      </div>
    </header>

    <div class="page-body">
      <div class="breadcrumb">
        <a href="dashboard.html">Dashboard</a> › Evaluations
      </div>

      <div class="page-grid">
        <!-- LEFT: FORM -->
        <div>
          <div class="card">
            <h3><i class="fa-solid fa-clipboard-list" style="margin-right:8px;color:#2563eb;"></i>New Evaluation</h3>

            <div class="form-row">
              <label>Investigator *</label>
              <select id="investigatorSelect">
                <option value="">Loading investigators…</option>
              </select>
            </div>

            <div class="form-row">
              <label>Case Reference (optional)</label>
              <select id="caseSelect">
                <option value="">— Link to a case (optional) —</option>
              </select>
            </div>

            <div class="form-row">
              <label>Evaluation Date</label>
              <input type="date" id="evalDate">
            </div>

            <div class="form-row">
              <label>Overall Rating *</label>
              <div class="stars-row" id="starsOverall"></div>
              <input type="hidden" id="ratingOverall" value="0">
            </div>

            <div class="form-row">
              <label>Communication</label>
              <div class="stars-row" id="starsCommunication"></div>
              <input type="hidden" id="ratingCommunication" value="0">
            </div>

            <div class="form-row">
              <label>Case Handling</label>
              <div class="stars-row" id="starsCaseHandling"></div>
              <input type="hidden" id="ratingCaseHandling" value="0">
            </div>

            <div class="form-row">
              <label>Professionalism</label>
              <div class="stars-row" id="starsProfessional"></div>
              <input type="hidden" id="ratingProfessional" value="0">
            </div>

            <div class="form-row">
              <label>Speed / Efficiency</label>
              <div class="stars-row" id="starsSpeed"></div>
              <input type="hidden" id="ratingSpeed" value="0">
            </div>

            <div class="form-row">
              <label>Written Feedback</label>
              <textarea id="writtenFeedback" placeholder="General performance notes…"></textarea>
            </div>

            <div class="form-row">
              <label>Strengths</label>
              <textarea id="strengths" placeholder="What this investigator does well…" style="min-height:60px;"></textarea>
            </div>

            <div class="form-row">
              <label>Areas for Improvement</label>
              <textarea id="weaknesses" placeholder="Areas to develop…" style="min-height:60px;"></textarea>
            </div>

            <div class="form-row">
              <label>Recommendations</label>
              <textarea id="recommendations" placeholder="Suggested actions, training, reassignment…" style="min-height:60px;"></textarea>
            </div>

            <button class="btn-submit" id="submitBtn" onclick="submitEvaluation()">
              Save Evaluation
            </button>
            <div class="status-msg" id="statusMsg"></div>
          </div>
        </div>

        <!-- RIGHT: LIST -->
        <div>
          <div class="card">
            <h3><i class="fa-solid fa-folder-open" style="margin-right:8px;color:#2563eb;"></i>Previous Evaluations</h3>
            <div class="search-bar">
              <input type="text" id="searchInput" placeholder="Search by investigator name…" oninput="filterEvals()">
            </div>
            <div id="evalsList">
              <p style="color:#9ca3af;font-size:13px;">Loading evaluations…</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
lucide.createIcons();

// ── AUTH ──────────────────────────────────────────────────────
const token    = localStorage.getItem('token');
const userRole = (localStorage.getItem('userRole') || '').toLowerCase();
if (!token) window.location.href = 'login.html';
if (userRole === 'investigator') {
  alert('Access denied. Investigators cannot access evaluations.');
  window.location.href = 'dashboard.html';
}

const BASE_URL    = '';
const authHeaders = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };

// ── SIDEBAR ───────────────────────────────────────────────────
(function buildNav() {
  const menu = document.getElementById('sidebarMenu');
  const items = [
    { href:'dashboard.html', icon:'layout-dashboard', label:'Main Dashboard' },
    { href:'cases.html',     icon:'file-text',        label:'Case Detail' },
    { href:'map.html',       icon:'map',              label:'Map View' },
    { href:'report.html',    icon:'bar-chart-3',      label:'Report Screen' },
    { href:'caseList.html',  icon:'list',             label:'Case List' },
    { href:'resolved.html',  icon:'check-circle',     label:'Resolved Cases' },
    { href:'assign.html',    icon:'user-check',       label:'Assign Investigator' },
    { href:'commander.html', icon:'bar-chart',        label:'Commander Dashboard' },
    { href:'evaluations.html', icon:'star',           label:'Evaluations', active:true },
    { href:'admin.html',     icon:'settings',         label:'User Management' },
  ];
  menu.innerHTML = `<p class="menu-title">NAVIGATION</p>` +
    items.map(i => `<a href="${i.href}" class="${i.active?'active':''}" style="display:flex;align-items:center;gap:10px;">
      <i data-lucide="${i.icon}"></i>${i.label}</a>`).join('') +
    `<a href="login.html" style="display:flex;align-items:center;gap:10px;" onclick="localStorage.clear()">
      <i data-lucide="log-out"></i>Logout</a>`;
  lucide.createIcons();
})();

// ── STATE ─────────────────────────────────────────────────────
let allInvestigators = [];
let allEvals         = [];

// ── STAR RATING ───────────────────────────────────────────────
function renderStars(containerId, fieldId, value = 0) {
  const container = document.getElementById(containerId);
  if (!container) return;
  container.innerHTML = '';
  for (let i = 1; i <= 5; i++) {
    const s = document.createElement('span');
    s.className   = 'star' + (i <= value ? ' filled' : '');
    s.innerHTML = '<i class="fa-regular fa-star"></i>';
    s.addEventListener('click', () => {
      document.getElementById(fieldId).value = i;
      // update each star's visual state
      const stars = container.querySelectorAll('.star');
      stars.forEach((st, idx) => {
        const filled = idx < i;
        st.classList.toggle('filled', filled);
        st.innerHTML = filled ? '<i class="fa-solid fa-star"></i>' : '<i class="fa-regular fa-star"></i>';
      });
    });
    container.appendChild(s);
  }
}

// ── LOAD INVESTIGATORS ────────────────────────────────────────
async function loadInvestigators() {
  const sel = document.getElementById('investigatorSelect');
  try {
    const res  = await fetch(`${BASE_URL}/api/investigators`, { headers: authHeaders });
    allInvestigators = await res.json();
    sel.innerHTML = `<option value="">— Select investigator —</option>` +
      allInvestigators.map(inv =>
        `<option value="${inv.id}">${inv.full_name || inv.email} (${inv.badge_number || 'No badge'})</option>`
      ).join('');
    sel.addEventListener('change', () => { if (sel.value) checkExistingEval(sel.value); });
  } catch(e) {
    sel.innerHTML = `<option value="">Could not load investigators</option>`;
  }
}

// ── LOAD CASES ────────────────────────────────────────────────
async function loadCases() {
  try {
    const res   = await fetch(`${BASE_URL}/api/cases`, { headers: authHeaders });
    const cases = await res.json();
    const sel   = document.getElementById('caseSelect');
    sel.innerHTML = `<option value="">— Link to a case (optional) —</option>` +
      (Array.isArray(cases) ? cases : []).map(c =>
        `<option value="${c.id}">${c.case_number || c.id} — ${c.suspect_name || 'Unknown'}</option>`
      ).join('');
  } catch(e) {}
}

// ── CHECK EXISTING EVAL FOR SELECTED INVESTIGATOR ─────────────
async function checkExistingEval(invId) {
  const existing = allEvals.find(e => String(e.investigator_id) === String(invId));
  if (existing) {
    // Pre-fill form
    document.getElementById('ratingOverall').value        = existing.rating_overall || 0;
    document.getElementById('ratingCommunication').value  = existing.rating_communication || 0;
    document.getElementById('ratingCaseHandling').value   = existing.rating_case_handling || 0;
    document.getElementById('ratingProfessional').value   = existing.rating_professionalism || 0;
    document.getElementById('ratingSpeed').value          = existing.rating_speed || 0;
    document.getElementById('writtenFeedback').value      = existing.written_feedback || '';
    document.getElementById('strengths').value            = existing.strengths || '';
    document.getElementById('weaknesses').value           = existing.weaknesses || '';
    document.getElementById('recommendations').value      = existing.recommendations || '';
    renderStars('starsOverall',       'ratingOverall',       existing.rating_overall || 0);
    renderStars('starsCommunication', 'ratingCommunication', existing.rating_communication || 0);
    renderStars('starsCaseHandling',  'ratingCaseHandling',  existing.rating_case_handling || 0);
    renderStars('starsProfessional',  'ratingProfessional',  existing.rating_professionalism || 0);
    renderStars('starsSpeed',         'ratingSpeed',         existing.rating_speed || 0);
    showStatus('Existing evaluation loaded — updating it.', 'info');
  }
}

// ── LOAD EVALUATIONS ──────────────────────────────────────────
async function loadEvals() {
  const list = document.getElementById('evalsList');
  try {
    const res = await fetch(`${BASE_URL}/api/evaluations`, { headers: authHeaders });
    allEvals  = await res.json();
    renderEvals(allEvals);
  } catch(e) {
    list.innerHTML = `<p style="color:#dc2626;font-size:13px;">Could not load evaluations.</p>`;
  }
}

function renderEvals(evals) {
  const list = document.getElementById('evalsList');
  if (!evals || evals.length === 0) {
    list.innerHTML = `<p style="color:#9ca3af;font-size:13px;">No evaluations yet.</p>`;
    return;
  }
  list.innerHTML = evals.map(e => {
    const inv   = allInvestigators.find(i => String(i.id) === String(e.investigator_id));
    const name  = inv ? (inv.full_name || inv.email) : 'Unknown';
    const stars = ( '<i class="fa-solid fa-star"></i>' ).repeat(e.rating_overall||0)
          + ( '<i class="fa-regular fa-star"></i>' ).repeat(5-(e.rating_overall||0));
    const date  = e.evaluation_date ? new Date(e.evaluation_date).toLocaleDateString('en-ZA') : 'N/A';
    return `<div class="eval-card">
      <div class="eval-card-header">
        <span class="eval-name">${name}</span>
        <span class="eval-stars">${stars}</span>
      </div>
      <div class="eval-date">${date}</div>
      <p class="eval-feedback">${e.written_feedback || 'No written feedback.'}</p>
      <div class="rating-bars">
        ${ratingBar('Communication', e.rating_communication)}
        ${ratingBar('Case Handling', e.rating_case_handling)}
        ${ratingBar('Professional', e.rating_professionalism)}
        ${ratingBar('Speed', e.rating_speed)}
      </div>
    </div>`;
  }).join('');
}

function ratingBar(label, val) {
  const pct = Math.round(((val||0)/5)*100);
  return `<div class="rating-row">
    <span class="rating-label">${label}</span>
    <div class="rating-bar-bg"><div class="rating-bar-fill" style="width:${pct}%"></div></div>
    <span class="rating-num">${val||0}/5</span>
  </div>`;
}

function filterEvals() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  if (!q) { renderEvals(allEvals); return; }
  renderEvals(allEvals.filter(e => {
    const inv = allInvestigators.find(i => String(i.id) === String(e.investigator_id));
    return (inv?.full_name||'').toLowerCase().includes(q) || (inv?.email||'').toLowerCase().includes(q);
  }));
}

// ── SUBMIT EVALUATION ─────────────────────────────────────────
async function submitEvaluation() {
  const invId = document.getElementById('investigatorSelect').value;
  if (!invId)                              { showStatus('Please select an investigator.', 'error'); return; }
  const overall = parseInt(document.getElementById('ratingOverall').value);
  if (!overall)                            { showStatus('Please give at least an overall rating.', 'error'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Saving…';

  try {
    const res = await fetch(`${BASE_URL}/api/evaluations`, {
      method: 'POST', headers: authHeaders,
      body: JSON.stringify({
        investigator_id:        invId,
        rating_overall:         overall,
        rating_communication:   parseInt(document.getElementById('ratingCommunication').value)||0,
        rating_case_handling:   parseInt(document.getElementById('ratingCaseHandling').value)||0,
        rating_professionalism: parseInt(document.getElementById('ratingProfessional').value)||0,
        rating_speed:           parseInt(document.getElementById('ratingSpeed').value)||0,
        written_feedback:       document.getElementById('writtenFeedback').value,
        strengths:              document.getElementById('strengths').value,
        weaknesses:             document.getElementById('weaknesses').value,
        recommendations:        document.getElementById('recommendations').value,
      })
    });
    if (!res.ok) { const e = await res.json(); throw new Error(e.message); }
    showStatus('✔ Evaluation saved successfully.', 'success');
    await loadEvals();
  } catch(e) {
    showStatus(`Failed: ${e.message}`, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Save Evaluation';
  }
}

function showStatus(msg, type) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg; el.className = `status-msg ${type}`; el.style.display = 'block';
  if (type === 'success') setTimeout(() => el.style.display='none', 4000);
}

// ── INIT ──────────────────────────────────────────────────────
// Set today's date as default
document.getElementById('evalDate').value = new Date().toISOString().split('T')[0];
// Render blank star inputs
renderStars('starsOverall',       'ratingOverall');
renderStars('starsCommunication', 'ratingCommunication');
renderStars('starsCaseHandling',  'ratingCaseHandling');
renderStars('starsProfessional',  'ratingProfessional');
renderStars('starsSpeed',         'ratingSpeed');

loadInvestigators();
loadCases();
loadEvals();
</script>
</body>
</html>
