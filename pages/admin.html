<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management — Eskom Theft Detection</title>
  <link rel="stylesheet" href="../css/dashboard.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    html,body,.layout,.main{height:100%;}
    .main{display:flex;flex-direction:column;overflow:hidden;}
    .page-body{flex:1;overflow-y:auto;padding:24px 32px;}
    /* Stat cards */
    .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px;}
    .stat-card{background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 2px 8px rgba(0,0,0,.05);border-left:4px solid #2563eb;}
    .stat-card.red{border-color:#dc2626;} .stat-card.green{border-color:#16a34a;} .stat-card.purple{border-color:#7c3aed;}
    .stat-card h4{font-size:11px;color:#6b7280;font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
    .stat-card p{font-size:26px;font-weight:800;margin:4px 0 0;}
    .stat-card.red p{color:#dc2626;} .stat-card.green p{color:#16a34a;} .stat-card.purple p{color:#7c3aed;}
    .stat-card p.blue{color:#2563eb;}
    /* Toolbar */
    .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
    .toolbar input{flex:1;min-width:200px;padding:10px 14px;border-radius:9px;border:1.5px solid #e5e9f5;font-family:inherit;font-size:13px;background:#f8fafc;}
    .toolbar select{padding:10px 14px;border-radius:9px;border:1.5px solid #e5e9f5;font-family:inherit;font-size:13px;background:#f8fafc;}
    .toolbar input:focus,.toolbar select:focus{outline:none;border-color:#2563eb;}
    .btn{padding:10px 18px;border-radius:9px;border:none;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:opacity .2s;white-space:nowrap;}
    .btn:hover{opacity:.85;} .btn-blue{background:#2563eb;color:#fff;} .btn-red{background:#dc2626;color:#fff;} .btn-outline{background:#fff;color:#374151;border:1.5px solid #d1d5db;}
    /* Table */
    .table-wrap{background:#fff;border-radius:14px;border:1.5px solid #e5e9f5;overflow:hidden;}
    table{width:100%;border-collapse:collapse;min-width:700px;}
    thead th{background:#0f1a3e;color:#fff;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:14px 16px;text-align:left;white-space:nowrap;}
    thead th:first-child{border-radius:12px 0 0 0;} thead th:last-child{border-radius:0 12px 0 0;}
    tbody tr{border-bottom:1px solid #f1f5f9;} tbody tr:hover{background:#f8fafc;}
    tbody td{padding:12px 16px;font-size:13.5px;color:#374151;vertical-align:middle;}
    .role-badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;}
    .role-admin{background:#ede9fe;color:#5b21b6;} .role-commander{background:#dbeafe;color:#1d4ed8;} .role-investigator{background:#dcfce7;color:#15803d;}
    .active-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;}
    .dot-green{background:#16a34a;} .dot-red{background:#dc2626;}
    .action-cell{white-space:nowrap;display:flex;gap:6px;}
    .tbl-btn{padding:5px 11px;border-radius:6px;border:none;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:opacity .2s;}
    .tbl-btn:hover{opacity:.8;}
    .tbl-btn-blue{background:#dbeafe;color:#1d4ed8;} .tbl-btn-red{background:#fee2e2;color:#b91c1c;} .tbl-btn-green{background:#dcfce7;color:#15803d;} .tbl-btn-orange{background:#ffedd5;color:#c2410c;}
    /* Modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:center;justify-content:center;}
    .modal{background:#fff;border-radius:14px;padding:28px 32px;width:420px;max-width:95vw;box-shadow:0 8px 40px rgba(0,0,0,.18);}
    .modal h3{font-size:17px;font-weight:700;margin-bottom:20px;}
    .modal-row{margin-bottom:14px;}
    .modal-row label{display:block;font-size:12px;font-weight:600;color:#6b7280;margin-bottom:5px;text-transform:uppercase;}
    .modal-row input,.modal-row select{width:100%;padding:10px 12px;border-radius:8px;border:1.5px solid #e5e9f5;font-family:inherit;font-size:13.5px;box-sizing:border-box;}
    .modal-row input:focus,.modal-row select:focus{outline:none;border-color:#2563eb;}
    .modal-actions{display:flex;gap:10px;margin-top:20px;}
    .modal-status{font-size:13px;margin-top:10px;padding:10px;border-radius:8px;display:none;}
    .modal-status.success{background:#dcfce7;color:#15803d;} .modal-status.error{background:#fee2e2;color:#b91c1c;}
    .breadcrumb{font-size:12px;color:#9ca3af;margin-bottom:16px;}
    .breadcrumb a{color:#2563eb;text-decoration:none;}
    @media(max-width:700px){.stat-row{grid-template-columns:1fr 1fr;}}
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon"><i class="fa-solid fa-bolt"></i></div>
      <div><h2>Eskom</h2><p>Theft Detection</p></div>
    </div>
    <nav class="menu" id="sidebarMenu"><p class="menu-title">NAVIGATION</p></nav>
  </aside>

  <main class="main">
    <header class="topbar" style="background:linear-gradient(90deg,#1e3a8a,#2563eb);">
      <div><h1>User Management</h1><p>Create, edit, and manage all system users</p></div>
    </header>

    <div class="page-body">
      <div class="breadcrumb"><a href="dashboard.html">Dashboard</a> › User Management</div>

      <!-- Stats -->
      <div class="stat-row">
        <div class="stat-card"><h4>Total Users</h4><p class="blue" id="statTotal">—</p></div>
        <div class="stat-card red"><h4>Admins</h4><p id="statAdmins">—</p></div>
        <div class="stat-card"><h4>Commanders</h4><p class="blue" id="statCommanders">—</p></div>
        <div class="stat-card green"><h4>Investigators</h4><p id="statInvestigators">—</p></div>
      </div>

      <!-- Toolbar -->
      <div class="toolbar">
        <input type="text" id="searchInput" placeholder="Search by email or role…" oninput="applyFilters()">
        <select id="filterRole" onchange="applyFilters()">
          <option value="">All Roles</option>
          <option value="admin">Admin</option>
          <option value="commander">Commander</option>
          <option value="investigator">Investigator</option>
        </select>
        <select id="filterStatus" onchange="applyFilters()">
          <option value="">All Statuses</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
        <button class="btn btn-blue" onclick="openCreateModal()">
          <i data-lucide="user-plus"></i> Add User
        </button>
      </div>

      <!-- Table -->
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Email</th>
              <th>Role</th>
              <th>Status</th>
              <th>Created</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="userTableBody">
            <tr><td colspan="5" style="text-align:center;padding:40px;color:#9ca3af;">Loading users…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- CREATE / EDIT MODAL -->
<div class="modal-overlay" id="modalOverlay" style="display:none;" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 id="modalTitle">Add New User</h3>
    <input type="hidden" id="editUserId">
    <div class="modal-row">
      <label>Email *</label>
      <input type="email" id="modalEmail" placeholder="user@eskom.co.za">
    </div>
    <div class="modal-row">
  <label>Full Name *</label>
  <input type="text" id="modalFullName" placeholder="John Doe">
</div>
    <div class="modal-row" id="passwordRow">
      <label>Password *</label>
      <input type="password" id="modalPassword" placeholder="Min 6 characters">
    </div>
    <div class="modal-row">
      <label>Role *</label>
      <select id="modalRole">
        <option value="">— Select role —</option>
        <option value="admin">Admin</option>
        <option value="commander">Commander</option>
        <option value="investigator">Investigator</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-blue" id="modalSaveBtn" onclick="saveUser()">Save User</button>
      <button class="btn btn-outline" onclick="document.getElementById('modalOverlay').style.display='none'">Cancel</button>
    </div>
    <div class="modal-status" id="modalStatus"></div>
  </div>
</div>

<script>
lucide.createIcons();

const token    = localStorage.getItem('token');
const userRole = (localStorage.getItem('userRole')||'').toLowerCase();
if (!token) window.location.href = 'login.html';
if (userRole !== 'admin') { alert('Admin access only.'); window.location.href = 'dashboard.html'; }

const BASE_URL    = '';
const authHeaders = { 'Content-Type':'application/json', 'Authorization':`Bearer ${token}` };

// Sidebar
(function(){
  const m = document.getElementById('sidebarMenu');
  const items = [
    {href:'dashboard.html',  icon:'layout-dashboard', label:'Main Dashboard'},
    {href:'cases.html',      icon:'file-text',        label:'Case Detail'},
    {href:'map.html',        icon:'map',              label:'Map View'},
    {href:'report.html',     icon:'bar-chart-3',      label:'Report Screen'},
    {href:'caseList.html',   icon:'list',             label:'Case List'},
    {href:'resolved.html',   icon:'check-circle',     label:'Resolved Cases'},
    {href:'assign.html',     icon:'user-check',       label:'Assign Investigator'},
    {href:'commander.html',  icon:'bar-chart',        label:'Commander Dashboard'},
    {href:'evaluations.html',icon:'star',             label:'Evaluations'},
    {href:'admin.html',      icon:'settings',         label:'User Management', active:true},
  ];
  m.innerHTML = `<p class="menu-title">NAVIGATION</p>` +
    items.map(i=>`<a href="${i.href}" class="${i.active?'active':''}" style="display:flex;align-items:center;gap:10px;">
      <i data-lucide="${i.icon}"></i>${i.label}</a>`).join('') +
    `<a href="login.html" style="display:flex;align-items:center;gap:10px;" onclick="localStorage.clear()">
      <i data-lucide="log-out"></i>Logout</a>`;
  lucide.createIcons();
})();

let allUsers   = [];
let filtered   = [];

// ── LOAD USERS ────────────────────────────────────────────────
async function loadUsers() {
  try {
    const res = await fetch(`${BASE_URL}/api/users`, { headers: authHeaders });
    allUsers  = await res.json();
    updateStats();
    applyFilters();
  } catch(e) {
    document.getElementById('userTableBody').innerHTML =
      `<tr><td colspan="5" style="text-align:center;padding:40px;color:#dc2626;">Failed to load users: ${e.message}</td></tr>`;
  }
}

function updateStats() {
  document.getElementById('statTotal').textContent        = allUsers.length;
  document.getElementById('statAdmins').textContent       = allUsers.filter(u=>u.role==='admin').length;
  document.getElementById('statCommanders').textContent   = allUsers.filter(u=>u.role==='commander').length;
  document.getElementById('statInvestigators').textContent= allUsers.filter(u=>u.role==='investigator').length;
}

function applyFilters() {
  const q     = document.getElementById('searchInput').value.toLowerCase();
  const role  = document.getElementById('filterRole').value;
  const status= document.getElementById('filterStatus').value;
  filtered = allUsers.filter(u => {
    const matchQ  = !q    || u.email.toLowerCase().includes(q) || u.role.includes(q);
    const matchR  = !role || u.role === role;
    const matchS  = !status || (status==='active' ? u.is_active !== false : u.is_active === false);
    return matchQ && matchR && matchS;
  });
  renderTable();
}

function renderTable() {
  const tbody = document.getElementById('userTableBody');
  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:40px;color:#9ca3af;">No users match your filters.</td></tr>`;
    return;
  }
  tbody.innerHTML = filtered.map(u => {
    const active  = u.is_active !== false;
    const created = u.created_at ? new Date(u.created_at).toLocaleDateString('en-ZA') : 'N/A';
    return `<tr>
      <td style="font-weight:600;">${u.email}</td>
      <td><span class="role-badge role-${u.role}">${u.role}</span></td>
      <td>
        <span class="active-dot ${active?'dot-green':'dot-red'}"></span>
        ${active ? 'Active' : 'Inactive'}
      </td>
      <td>${created}</td>
      <td><div class="action-cell">
        <button class="tbl-btn tbl-btn-blue" onclick="openEditModal('${u.id}')">Edit</button>
        <button class="tbl-btn ${active?'tbl-btn-orange':'tbl-btn-green'}"
          onclick="toggleStatus('${u.id}', ${active})">${active ? 'Deactivate' : 'Activate'}</button>
        <button class="tbl-btn tbl-btn-red" onclick="deleteUser('${u.id}', '${u.email}')">Delete</button>
      </div></td>
    </tr>`;
  }).join('');
}

// ── CREATE MODAL ──────────────────────────────────────────────
function openCreateModal() {
  document.getElementById('modalTitle').textContent = 'Add New User';
  document.getElementById('editUserId').value       = '';
  document.getElementById('modalEmail').value       = '';
  document.getElementById('modalFullName').value    = '';
  document.getElementById('modalPassword').value    = '';
  document.getElementById('modalRole').value        = '';
  document.getElementById('passwordRow').style.display = '';
  document.getElementById('modalStatus').style.display = 'none';
  document.getElementById('modalOverlay').style.display = 'flex';
}

function openEditModal(userId) {
  const u = allUsers.find(x => x.id === userId);
  if (!u) return;
  document.getElementById('modalTitle').textContent = 'Edit User';
  document.getElementById('editUserId').value       = u.id;
  document.getElementById('modalEmail').value       = u.email;
  document.getElementById('modalPassword').value    = '';
  document.getElementById('modalRole').value        = u.role;
  document.getElementById('passwordRow').style.display = 'none'; // editing doesn't change password here
  document.getElementById('modalStatus').style.display = 'none';
  document.getElementById('modalOverlay').style.display = 'flex';
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay'))
    document.getElementById('modalOverlay').style.display = 'none';
}

// ── SAVE USER ─────────────────────────────────────────────────
async function saveUser() {
  const id        = document.getElementById('editUserId').value;
  const email     = document.getElementById('modalEmail').value.trim();
  const full_name = document.getElementById('modalFullName').value.trim();
  const pass      = document.getElementById('modalPassword').value;
  const role      = document.getElementById('modalRole').value;
  const btn       = document.getElementById('modalSaveBtn');

  if (!email || !role) { showModalStatus('Email and role are required.', 'error'); return; }
  if (!id && !pass)    { showModalStatus('Password is required for new users.', 'error'); return; }

  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    if (id) {
      // Edit: update role only
      const res = await fetch(`${BASE_URL}/api/users/${id}/role`, {
        method:'PUT', headers: authHeaders, body: JSON.stringify({ role })
      });
      if (!res.ok) { const e=await res.json(); throw new Error(e.message||e.error); }
    } else {
      // Create new user — send full_name so the NOT NULL constraint is satisfied
      const res = await fetch(`${BASE_URL}/api/users`, {
        method:'POST', headers: authHeaders,
        body: JSON.stringify({ email, password: pass, role, full_name: full_name || email })
      });
      if (!res.ok) { const e=await res.json(); throw new Error(e.message||e.error); }
    }
    showModalStatus('✔ Saved successfully.', 'success');
    setTimeout(() => {
      document.getElementById('modalOverlay').style.display = 'none';
      loadUsers();
    }, 1200);
  } catch(e) {
    showModalStatus(`Failed: ${e.message}`, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Save User';
  }
}

function showModalStatus(msg, type) {
  const el = document.getElementById('modalStatus');
  el.textContent = msg; el.className = `modal-status ${type}`; el.style.display = 'block';
}

// ── TOGGLE STATUS ─────────────────────────────────────────────
async function toggleStatus(id, currentlyActive) {
  const action = currentlyActive ? 'deactivate' : 'activate';
  if (!confirm(`${action.charAt(0).toUpperCase()+action.slice(1)} this user?`)) return;
  try {
    const res = await fetch(`${BASE_URL}/api/users/${id}/status`, {
      method:'PUT', headers: authHeaders, body: JSON.stringify({ is_active: !currentlyActive })
    });
    if (!res.ok) { const e=await res.json(); throw new Error(e.message); }
    await loadUsers();
  } catch(e) { alert(`Failed: ${e.message}`); }
}

// ── DELETE USER ───────────────────────────────────────────────
async function deleteUser(id, email) {
  if (!confirm(`Permanently delete user:\n${email}\n\nThis cannot be undone.`)) return;
  try {
    const res = await fetch(`${BASE_URL}/api/users/${id}`, { method:'DELETE', headers: authHeaders });
    if (!res.ok) { const e=await res.json(); throw new Error(e.message); }
    await loadUsers();
  } catch(e) { alert(`Failed: ${e.message}`); }
}

// ── INIT ──────────────────────────────────────────────────────
loadUsers();
</script>
</body>
</html>
